services:
  mysql:
    image: mysql:8.0
    container_name: mysql-inventory-k8s
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: inventory_service
      MYSQL_USER: shahid
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: shahid123

    ports:
      - "3366:3306"

    volumes:
      - mysql_data_inventory:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  mysql_data_inventory: